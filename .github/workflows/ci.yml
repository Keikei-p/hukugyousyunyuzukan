name: Verify site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run verify
      - name: Verify GitHub Pages build
        run: |
          npx astro build
          node scripts/prepare-github-pages.mjs
